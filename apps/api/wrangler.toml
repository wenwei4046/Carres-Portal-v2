# Wrangler config for the Hono API on Cloudflare Workers.
# Local dev: pnpm dev (runs `wrangler dev`)
# Production: `wrangler deploy --env production` (Phase 9 cutover 2026-05-10)

name = "carres-portal-v2-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Wrangler reads .dev.vars (gitignored) for local secrets.
# See .dev.vars.example for the required keys.

# Cron triggers — activate in later phases. Times in UTC; MYT = UTC + 8.
# [[triggers.crons]]
# cron = "0 1 * * *"  # 09:00 MYT daily

[observability]
enabled = true

# Production environment — deployed via `wrangler deploy --env production`.
# Secrets are set per-env via `wrangler secret put <KEY> --env production`.
# Custom routes (api.your-domain.com) deferred — using *.workers.dev for now.
[env.production]
name = "carres-portal-v2-api"

[env.production.observability]
enabled = true
