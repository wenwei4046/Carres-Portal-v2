name: Preview
# PREVIEW URL FIRST (UI MASTER, owner ruling 14 Oct 2026): every PR is published to its own
# address before it goes live, and design checks it there. The preview is the web app only,
# built exactly as production builds it, so it reads REAL data through the production API:
# it is checked read only (no Save, no Send). An API or database change previews its web
# part only; its server part is checked on live after merge.
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # Secrets never reach a fork's PR, so only this repository's branches get a preview.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the web app as production builds it
        env:
          # The deploy proof stamps the PR's own head commit, not GitHub's merge commit.
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --filter @carres/web build
      - name: Publish to the PR's preview address
        id: publish
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          branch="pr-${PR_NUMBER}"
          for attempt in 1 2 3; do
            if pnpm exec wrangler pages deploy ../web/dist --project-name carres-portal --branch "${branch}" --commit-hash "${HEAD_SHA}" --commit-message "PR #${PR_NUMBER} ${HEAD_SHA}" --commit-dirty=true; then
              echo "url=https://${branch}.carres-portal.pages.dev" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Preview publish refused on attempt ${attempt}"
            sleep 20
          done
          echo "::error::Preview publish was refused three times"
          exit 1
      - name: Prove the preview serves this commit
        shell: bash
        env:
          URL: ${{ steps.publish.outputs.url }}
        run: |
          for probe in $(seq 1 12); do
            served="$(curl -fsS "${URL}/__carres_deploy.json?proof=${HEAD_SHA}" || true)"
            if [[ "${served}" == *"\"${HEAD_SHA}\""* ]]; then
              echo "${URL} serves ${HEAD_SHA}"
              echo "Preview: ${URL} (serves ${HEAD_SHA})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${URL} does not serve ${HEAD_SHA}"
          exit 1
      - name: Post the preview address on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const marker = "<!-- carres-preview -->";
            const body = `${marker}\n**Preview:** ${process.env.URL}\nServes \`${process.env.HEAD_SHA.slice(0, 9)}\`. Real data: check read only (no Save, no Send).`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
