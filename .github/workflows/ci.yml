name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate migration law (never applies migrations)
        run: pnpm ci:migrations
      - name: Design and governance guards
        run: pnpm lint
      - name: Type checks
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Prove no server secret entered the web bundle
        shell: bash
        run: |
          if grep -R -E "SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|STRIPE_SECRET_KEY" apps/web/dist; then
            echo "Server-only secret name found in web build" >&2
            exit 1
          fi
