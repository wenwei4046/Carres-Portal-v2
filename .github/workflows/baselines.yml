name: Screenshot baselines
# SCREENSHOT BASELINES (UI MASTER, owner ruling 14 Oct 2026). CI checks every approved page against
# its stored pictures (`e2e-kit/kit-baselines.spec.ts`, run by `pnpm kit:check`). When a PR changes
# a page on purpose, add the label `update-baselines`: this job takes the new pictures on Linux, as
# CI does, and uploads them. They are committed to the PR, so its diff shows every picture before
# and after; approving that PR approves the pictures.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  update:
    if: ${{ github.event.label.name == 'update-baselines' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Take the pictures
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.kit.config.ts e2e-kit/kit-baselines.spec.ts --update-snapshots=all
      - name: Upload the pictures
        uses: actions/upload-artifact@v4
        with:
          name: baselines-${{ github.event.pull_request.head.sha }}
          path: e2e-kit/kit-baselines.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7
