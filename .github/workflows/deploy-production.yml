name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to redeploy (defaults to this workflow SHA)
        required: false
        type: string
      diagnose_schedule:
        description: Read registered schedules and scheduled-event errors without deploying
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.diagnose_schedule && format('scheduler-diagnostics-{0}', github.run_id) || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !inputs.diagnose_schedule }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select exact main commit
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: echo "sha=${REQUESTED_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Refuse a non-main source
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Repeat authoritative checks on the deployed SHA
        run: |
          pnpm ci:migrations
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Deploy both Pages projects from this SHA
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          pnpm exec wrangler pages deploy ../web/dist --project-name carres-portal --branch main --commit-hash "${DEPLOY_SHA}" --commit-message "main ${DEPLOY_SHA}" --commit-dirty=false
          pnpm exec wrangler pages deploy ../web/dist --project-name carres-pos --branch main --commit-hash "${DEPLOY_SHA}" --commit-message "main ${DEPLOY_SHA}" --commit-dirty=false
      - name: Deploy API Worker from this SHA
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: pnpm exec wrangler deploy --env production --var "PUBLIC_WEB_URL:https://pos.carresofficial.com" --var "DEPLOY_SHA:${DEPLOY_SHA}" --message "main ${DEPLOY_SHA}"
      - name: Wait for both Pages projects and Worker
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: pnpm ci:smoke
      - name: Deployment proof
        run: echo "All production surfaces report ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

  diagnose-schedule:
    if: ${{ inputs.diagnose_schedule }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Read schedules and scheduled errors only
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/carres-portal-v2-api/schedules`;
          const response = await fetch(url, {headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const data = await response.json();
          console.log(JSON.stringify({status:response.status,success:data.success,schedules:data.result,errors:data.errors}));
          if (!response.ok) process.exit(1);
          JS
          timeout 95s pnpm exec wrangler tail --env production --format json > /tmp/carres-scheduled-tail.json || test "$?" -eq 124
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data=Path('/tmp/carres-scheduled-tail.json').read_text()
          decoder=json.JSONDecoder()
          count=0
          while '{' in data:
              data=data[data.index('{'):]
              try:
                  event,end=decoder.raw_decode(data)
              except json.JSONDecodeError:
                  data=data[1:]
                  continue
              data=data[end:]
              if isinstance(event,dict) and isinstance(event.get('event'),dict) and event['event'].get('cron'):
                  count+=1
                  print(json.dumps({'cron':event['event']['cron'],'timestamp':event.get('eventTimestamp'),
                      'outcome':event.get('outcome'),'exceptions':event.get('exceptions',[])}))
          print(f'Scheduled events observed: {count}')
          PYTHON
