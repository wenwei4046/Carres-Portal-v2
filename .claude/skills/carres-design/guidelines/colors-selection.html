<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface);font-family:var(--font-sans)}
.rowdemo{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;font-size:13px}
.sw{display:inline-flex;gap:14px;margin-bottom:12px}
.chip{border-radius:8px;height:44px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;font-size:11px}
.hex{font-family:var(--font-mono);font-size:10px}</style></head>
<body>
<div class="sw">
<div class="chip" style="background:#378ADD;color:#fff">checkbox fill<span class="hex">#378ADD</span></div>
<div class="chip" style="background:#E6F1FB;color:#1E40AF">row wash<span class="hex">#E6F1FB</span></div>
</div>
<div class="rowdemo" style="background:#E6F1FB">
<input type="checkbox" class="checkbox is-select" checked>
<span style="color:#1A1A1A;font-weight:500">SO-1153 &nbsp;·&nbsp; LEE WEI YANG</span>
<span style="margin-left:auto;font-size:11px;color:#1E40AF">selected row</span>
</div>
</body></html>
