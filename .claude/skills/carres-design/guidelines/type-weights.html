<!-- @dsCard group="Type" viewport="700x180" name="Layer by weight, not size" subtitle="REF & SO id are the SAME size — tell them apart by weight + colour" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);display:flex;gap:26px;align-items:center}
.demo{display:flex;flex-direction:column;gap:2px}
.ref{font-size:13px;font-weight:600;color:#111827}
.so{font-size:13px;font-weight:400;color:#9CA3AF}
.arrow{font-size:11px;color:var(--text-secondary);max-width:300px;line-height:1.5}</style></head>
<body>
<div class="demo">
<span class="ref">TCF0475 <span style="font-size:11px;font-weight:400;color:#9CA3AF">+2</span></span>
<span class="so">SO-1112</span>
</div>
<div class="arrow">Both 13px. The REF is <b>600 near-black</b>; the SO id is <b>400 grey</b>. You read the difference by <b>weight and colour</b> — never by making one bigger. This is how the whole system stays calm and aligned.</div>
</body></html>
