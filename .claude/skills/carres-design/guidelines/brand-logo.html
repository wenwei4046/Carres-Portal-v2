<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface);font-family:var(--font-sans);display:flex;align-items:center;gap:30px}
.mark{display:flex;align-items:center;gap:12px}
.word{font-size:20px;font-weight:700;color:#1A1A1A;letter-spacing:-0.01em}
.on-dark{background:#111827;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:12px}
.on-dark .word{color:#fff}
.cap{font-size:11px;color:var(--text-muted)}</style></head>
<body>
<div class="mark"><img src="../assets/carres-logo.png" width="40" height="40" alt="Carres"><span class="word">Carres</span></div>
<div class="on-dark"><img src="../assets/carres-logo.png" width="34" height="34" alt="Carres"><span class="word">Carres</span></div>
<span class="cap">Flame heart · #C44D2B</span>
</body></html>
