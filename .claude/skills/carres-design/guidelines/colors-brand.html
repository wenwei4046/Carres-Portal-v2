<!-- @dsCard group="Colors" viewport="700x170" name="Brand flame" subtitle="Flame = ONE primary action per block + checked box. Never decoration." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface);font-family:var(--font-sans)}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box}
.name{font-size:12px;font-weight:600}.hex{font-size:10px;font-family:var(--font-mono);opacity:.8}
.note{margin-top:12px;font-size:11.5px;color:var(--text-secondary)}</style></head>
<body>
<div class="row">
<div class="sw" style="background:#C44D2B;color:#fff"><span class="name">Flame</span><span class="hex">#C44D2B · primary action</span></div>
<div class="sw" style="background:#9A3D22;color:#fff"><span class="name">Flame dark</span><span class="hex">#9A3D22 · hover</span></div>
<div class="sw" style="background:#F4E4DD;color:#9A3D22"><span class="name">Flame light</span><span class="hex">#F4E4DD · active fill</span></div>
</div>
<div class="note">Carried by the left nav + the single hero button per page. Never on titles, icons, borders, dividers or hovers.</div>
</body></html>
