<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--canvas);font-family:var(--font-sans)}

.ref{font-size:13px;font-weight:600;color:#111827}.sub{font-size:10px;color:#9CA3AF}
.date{font-size:12.5px;font-weight:600;color:#111827}.wk{font-size:10px;color:#9CA3AF}
tr.sel td{background:#E6F1FB}</style></head>

<table>

</table>
</body></html>
