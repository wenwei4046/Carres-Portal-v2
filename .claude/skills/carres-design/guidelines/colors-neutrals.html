<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-sans)}
.row{display:flex;gap:0}
.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
.n{font-size:10px;font-family:var(--font-mono)}
.lbl{display:flex;gap:0;margin-top:6px}
.lbl div{flex:1;font-size:9.5px;color:var(--text-muted);font-family:var(--font-mono);text-align:center}</style></head>
<body>
<div class="row">
<div class="sw" style="background:#F9FAFB"><span class="n" style="color:#9CA3AF">50</span></div>
<div class="sw" style="background:#F3F4F6"><span class="n" style="color:#9CA3AF">100</span></div>
<div class="sw" style="background:#E5E7EB"><span class="n" style="color:#6B7280">200</span></div>
<div class="sw" style="background:#D1D5DB"><span class="n" style="color:#4B5563">300</span></div>
<div class="sw" style="background:#9CA3AF"><span class="n" style="color:#fff">400</span></div>
<div class="sw" style="background:#6B7280"><span class="n" style="color:#fff">500</span></div>
<div class="sw" style="background:#4B5563"><span class="n" style="color:#fff">600</span></div>
<div class="sw" style="background:#374151"><span class="n" style="color:#fff">700</span></div>
<div class="sw" style="background:#1F2937"><span class="n" style="color:#fff">800</span></div>
<div class="sw" style="background:#111827"><span class="n" style="color:#fff">900</span></div>
</div>
<div class="lbl"><div>F9FAFB</div><div>F3F4F6</div><div>E5E7EB</div><div>D1D5DB</div><div>9CA3AF</div><div>6B7280</div><div>4B5563</div><div>374151</div><div>1F2937</div><div>111827</div></div>
</body></html>
