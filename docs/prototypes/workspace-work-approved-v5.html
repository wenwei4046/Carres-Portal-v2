<!doctype html>
<html lang="en" data-ha-style="dashboard">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carres Work · approved composition v5</title>
<style>
:root{--blue:#0878d1;--blue-soft:#eaf4ff;--ink:#17243a;--muted:#66758c;--line:#d7dee8;--canvas:#f4f7fa;--white:#fff;--red:#c9363f;--amber:#a65d00;--r:10px;--r2:6px;--s:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);font-size:14px}button,input{font:inherit;color:inherit}button{cursor:pointer}.ops-shell{min-height:100vh;display:grid;grid-template-columns:206px 1fr 44px}.sidebar,.utility{background:#fff;border-right:1px solid var(--line)}.utility{border-right:0;border-left:1px solid var(--line)}
.brand{height:52px;display:flex;align-items:center;padding:0 20px;color:#e84a2a;font:700 19px Georgia}.nav{padding:18px 14px}.nav button{width:100%;height:42px;border:0;background:transparent;border-radius:6px;text-align:left;padding:0 12px;margin:2px 0}.nav button.active{background:#e7f2fc;border-left:3px solid var(--blue);font-weight:650}.main{min-width:0;height:100vh;display:flex;flex-direction:column}.pagebar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px}.pagebar h1{font-size:22px;margin:0}.updated{margin-left:auto;font-size:12px;color:var(--muted)}
.command-bar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px}.tabs{display:flex;gap:20px;height:100%}.tab{border:0;background:none;border-bottom:2px solid transparent}.tab.active{border-color:var(--blue);font-weight:650}.search{margin-left:auto;border:1px solid var(--line);border-radius:6px;height:32px;padding:0 10px;width:205px}.iconbtn,.morebtn{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-grid;place-items:center}.iconbtn:hover,.morebtn:hover,.row:hover{background:#f0f4f8}.iconbtn:focus-visible,.morebtn:focus-visible,.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.workspace{min-height:0;flex:1;display:grid;grid-template-columns:240px 360px minmax(500px,1fr);gap:16px;padding:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.scope{display:flex;flex-direction:column;gap:16px}.scope .panel{overflow:visible}.panel-title{height:45px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);color:var(--blue);font-weight:700}.filter-list{padding:8px}.filter-row{width:100%;min-height:36px;border:0;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:7px 9px;text-align:left}.filter-row.active{background:var(--blue-soft);font-weight:650}.count{font-variant-numeric:tabular-nums;color:var(--muted)}
.list{min-height:0;overflow:auto}.group-title{position:sticky;top:0;z-index:2;height:40px;display:flex;align-items:center;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}.data-grid{padding:2px 0 8px}.card{margin:8px;border:1px solid var(--line);border-radius:var(--r2);background:#fff;overflow:hidden}.card.selected{background:#f2f7fc}.card.promise{border-left:2px solid var(--red)}.row{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px}.meta{font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.context{font-size:12px;color:var(--muted);margin-top:5px}.fact{font-size:14px;font-weight:700;margin-top:3px}.action{font-size:12px;font-weight:550;color:#42526a;margin-top:3px}.who{font-size:12px;color:var(--muted);margin-top:3px}.blocked{color:var(--amber)}.card-footer{height:32px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--muted)}.card-footer button{margin-left:auto;border:0;background:transparent;width:30px;height:30px;border-radius:5px}
.detail{min-width:0;overflow:auto;background:transparent;border:0}.detail>.panel{margin-bottom:16px}.identity{padding:14px}.identity-top{display:flex;align-items:center}.module{color:var(--blue);font-weight:700;font-size:12px}.object{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.identity .fact{font-size:18px;margin-top:12px}.identity .action{font-size:13px}.panel-body{padding:14px}.contact-head{display:flex;align-items:center}.contact-name{font-weight:700}.contact-tools{margin-left:auto;display:flex;gap:6px}.message{margin-top:12px;border:1px solid var(--line);border-radius:6px;background:#f7f9fb;padding:10px 12px;line-height:1.45}.helper{font-size:12px;color:var(--muted);margin-top:8px}.result-options{display:grid;gap:8px}.result-options label{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:10px}.completion{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.menu{position:absolute;right:0;top:38px;width:190px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px;box-shadow:0 8px 22px rgba(20,35,55,.12);display:none;z-index:5}.menu.open{display:block}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:9px;border-radius:5px}.menu button:hover{background:#f0f4f8}.morewrap{position:relative}.fixture{position:fixed;right:54px;bottom:10px;background:#17243a;color:#fff;padding:5px 9px;border-radius:5px;font-size:11px}.utility{display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:18px;color:var(--muted)}
.viewport-switch{display:flex;gap:4px;margin-left:4px}.viewport-switch button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.viewport-switch button.active{color:var(--blue);font-weight:700}.flag-queue,.work-surface{display:contents}
@media(max-width:1131px){.workspace{grid-template-columns:240px minmax(0,1fr)}.detail{display:none}.workspace.detail-open .list{display:none}.workspace.detail-open .detail{display:block}.detail .back{display:flex}.ops-shell{grid-template-columns:72px 1fr 44px}.brand{font-size:0}.brand:after{content:"C";font:700 20px Georgia}.nav button{font-size:0}.nav button:before{content:"□";font-size:15px}.nav button.active:before{content:"✓"}}
@media(min-width:1132px){.back{display:none!important}}
@media(max-width:767px){.ops-shell{display:block}.sidebar,.utility{display:none}.workspace{display:block;padding:0}.scope{display:none}.list,.detail{border:0;border-radius:0}.command-bar{padding:0 12px;gap:12px}.search{width:120px}.pagebar{padding:0 14px}.group-title{top:0}.card{margin:8px}.workspace.detail-open .detail{display:block;padding:8px}.fixture{right:8px}.updated{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="ops-shell">
 <aside class="sidebar"><div class="brand">CARRES</div><nav class="nav"><button>Dashboard</button><button class="active">Work</button><button>Staff & Duties</button><button>Issue Tracker</button><button>Sales Orders</button><button>Purchasing</button><button>Delivery</button><button>Warehouse</button><button>Payments</button></nav></aside>
 <main class="main">
  <header class="pagebar"><h1>Work</h1><span class="updated">Last updated 09:42</span></header>
  <div class="command-bar"><div class="tabs"><button class="tab active">My Work</button><button class="tab">Team Work</button></div><input class="search" placeholder="Search work…" aria-label="Search work"><button class="iconbtn" title="Filters" aria-label="Filters">☷</button><div class="viewport-switch"><button data-size="1440" class="active">1440</button><button data-size="1180">1180</button><button data-size="820">820</button><button data-size="390">390</button></div></div>
  <div class="workspace work-surface" id="workspace">
   <aside class="scope">
    <section class="panel"><div class="panel-title">Working day</div><div class="filter-list"><button class="filter-row"><span>Missed</span><span class="count">3</span></button><button class="filter-row"><span>Mon, 21 Sep</span></button><button class="filter-row"><span>Tue, 22 Sep</span><span class="count">2</span></button><button class="filter-row active"><span>Wed, 23 Sep<br><small>Today</small></span><span class="count">4</span></button><button class="filter-row"><span>Thu, 24 Sep</span><span class="count">1</span></button><button class="filter-row"><span>Fri, 25 Sep</span><span class="count">2</span></button></div></section>
    <section class="panel"><div class="panel-title">Module</div><div class="filter-list"><button class="filter-row active"><span>All modules</span><span class="count">7</span></button><button class="filter-row"><span>Sales Orders</span><span class="count">1</span></button><button class="filter-row"><span>Purchasing</span><span class="count">2</span></button><button class="filter-row"><span>Receiving</span><span class="count">1</span></button><button class="filter-row"><span>Delivery</span><span class="count">2</span></button><button class="filter-row"><span>Payment</span><span class="count">1</span></button></div></section>
   </aside>
   <section class="panel list flag-queue" aria-label="Work list"><div class="group-title">Missed <span class="count">&nbsp;3</span></div><div class="data-grid" id="cards"></div><div class="group-title">Wed, 23 Sep <span class="count">&nbsp;4</span></div><div class="data-grid" id="todayCards"></div></section>
   <section class="detail row-detail" aria-label="Selected work" id="detail"><button class="back iconbtn" aria-label="Back to work" onclick="backToList()">←</button>
    <section class="panel identity"><div class="identity-top"><span class="module" id="dModule"></span><button class="object" id="dObject"><span id="dObjectText"></span><span>↗</span></button></div><div class="fact" id="dFact"></div><div class="action" id="dAction"></div></section>
    <section class="panel" id="contactPanel"><div class="panel-title contact-head"><span id="contactTitle"></span><span class="contact-tools"><button class="iconbtn" title="WhatsApp" aria-label="WhatsApp">◉</button><button class="iconbtn" title="Email" aria-label="Email">✉</button><span class="morewrap"><button class="morebtn" title="More" aria-label="More" id="more">⋮</button><span class="menu" id="menu"><button>Use another template</button><button>Save as template</button><button>Communication history</button></span></span></span></div><div class="panel-body"><div class="message" id="message"></div><div class="helper">Opening or copying does not record sending.</div></div></section>
    <section class="panel"><div class="panel-title">Record result</div><div class="panel-body"><div class="result-options"><label><input type="radio" name="result"> Confirmed</label><label><input type="radio" name="result"> New date received</label><label><input type="radio" name="result"> No answer</label></div><div class="completion" id="completion"></div></div></section>
   </section>
  </div>
 </main>
 <aside class="utility">▦<br>☷<br>▤</aside>
</div><div class="fixture">Prototype fixture · no data is saved</div>
<script>
const items=[
 {group:'missed',module:'Delivery',context:'Promised Tue, 22 Sep',fact:'Not delivered',action:'Arrange a new delivery date',who:'NETS Logistics',object:'SO-1318',message:'Hi, please arrange a new delivery date for SO-1318.',completion:'The new delivery date and time are recorded.',promise:true},
 {group:'missed',module:'Purchasing',context:'Required Tue, 22 Sep',fact:'Supplier date not confirmed',action:'Ask the supplier to confirm the PO delivery date',who:'Nice Future',object:'PO-MY-00008751',message:'Hi, please confirm the delivery date for the current PO version.',completion:'The confirmed PO delivery date is recorded.'},
 {group:'missed',module:'Payment',context:'Required Tue, 22 Sep',fact:'RM 1,280.00 is still outstanding',action:'Request the outstanding payment',who:'Customer (masked)',object:'SO-1304',message:'Hi, please arrange the outstanding payment of RM 1,280.00.',completion:'The payment or approved exception is recorded.'},
 {group:'today',module:'Delivery',context:'Required Wed, 23 Sep',fact:'Delivery proof needs review',action:'Check delivery proof',who:'Customer (masked)',object:'DO-140926-0007',message:'Proof package received. Review every photo before recording the result.',completion:'The proof review result is recorded.'},
 {group:'today',module:'Receiving',context:'Required Wed, 23 Sep',fact:'2 units arrived at Carres Klang Warehouse',action:'Receive CODY-K · 2 units',who:'Carres Klang Warehouse',object:'PO-2048',message:'Open the owning Receiving record to check and record the goods.',completion:'The governed receiving result is recorded.'},
 {group:'today',module:'Sales Orders',context:'Required Wed, 23 Sep',fact:'Customer delivery date is missing',action:'Ask for the requested delivery date',who:'Customer (masked)',object:'SO-1319',message:'Hi, please confirm your requested delivery date.',completion:'The requested date or governed no-date answer is recorded.'},
 {group:'today',module:'Delivery',context:'Required Wed, 23 Sep',fact:'Warehouse confirmation is missing',action:'Confirm the goods are ready',who:'Warehouse',object:'SO-1320',message:'Please confirm when the goods are ready for delivery.',completion:'The readiness result is recorded.'}
];
const cards=document.getElementById('cards'),today=document.getElementById('todayCards');
function card(x,i){const el=document.createElement('article');el.className='card'+(i===0?' selected':'')+(x.promise?' promise':'');el.innerHTML=`<button class="row"><span class="meta">${x.module}</span><span class="context">${x.context}</span><span class="fact">${x.fact}</span><span class="action">${x.action}</span><span class="who">${x.who}</span></button><footer class="card-footer"><span>${x.object}</span><button title="Open ${x.object}" aria-label="Open ${x.object}">↗</button></footer>`;el.querySelector('.row').onclick=()=>select(i,el);return el}
items.forEach((x,i)=>(x.group==='missed'?cards:today).append(card(x,i)));
function select(i,el){document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');const x=items[i];dModule.textContent=x.module;dObjectText.textContent=x.object;dFact.textContent=x.fact;dAction.textContent=x.action+' · '+x.who;contactTitle.textContent='Contact '+x.who;message.textContent=x.message;completion.textContent=x.completion;workspace.classList.add('detail-open')}
function backToList(){workspace.classList.remove('detail-open');document.querySelector('.card.selected .row')?.focus()}
more.onclick=()=>menu.classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.morewrap'))menu.classList.remove('open')});select(0,document.querySelector('.card'));
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.documentElement.style.setProperty('--preview-width',b.dataset.size+'px');alert('Open the browser responsive tools at '+b.dataset.size+'px to inspect the exact breakpoint.')});
</script>
</body></html>
