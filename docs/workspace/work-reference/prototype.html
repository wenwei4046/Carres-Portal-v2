<html lang="en"><head><meta charset="utf-8"><title>Workspace prototype</title>

 $('mid').querySelectorAll('.ci.act').forEach(e=>e.onclick=ev=>{if(ev.target.closest('a.dl'))return;const k=e.dataset.k;S.sel=S.sel===k?null:k;if(S.sel)S.tab=ACTS[k].tab;render()});
 $('mid').querySelectorAll('.more[data-m]').forEach(e=>e.onclick=()=>{S.open[e.dataset.m]=!S.open[e.dataset.m];mid()});
 wire();
}
/* B · one row of steps on top, the chosen step's checklist below */
function midB(){
 const R=rows();if(!S.step){const f=R.find(r=>r.items.some(o=>o.k&&!S.done[o.k]));S.step=f?f.mod:'Proceed'}
 const steps=R.map((r,i)=>{const st=r.st[1]==='red'?'miss':r.st[0]==='Done'?'done':'';
  return `<div class="stp ${st}${S.step===r.mod?' on':''}" data-m="${r.mod}"><span class="sd">${st==='done'?'✓':st==='miss'?'!':''}</span><b>${r.mod}</b><span class="sx">${r.date||''}</span><span class="sy ${r.st[1]}">${r.st[0]}</span></div>`}).join('');
 const r=R.find(x=>x.mod===S.step);
 const fold=o=>o.mk==='t'&&!o.doc&&!o.grp;const done=r.items.filter(fold),show=S.open[r.mod]?r.items:r.items.filter(o=>!fold(o));
 const more=done.length?`<div class="more" data-m="${r.mod}"><span class="mk">✓</span>${done.length} done<span class="chev${S.open[r.mod]?' rot':''}">›</span></div>`:'';
 $('mid').innerHTML=HEAD()+`<div class="stps">${steps}</div><div class="stbody"><div class="rh2"><b>${r.mod}</b><span class="v">${r.date||''}</span><span class="stt ${r.st[1]}">${r.st[0]}</span></div><div class="rc">${show.map(li).join('')}${more}</div></div>`;
 $('mid').querySelectorAll('.stp').forEach(e=>e.onclick=()=>{S.step=e.dataset.m;mid()});
 bindCommon();
}
/* C · sorted by what to do */
function midC(){
 const F=flat();const now=F.filter(o=>o.k&&!S.done[o.k]),next=F.filter(o=>o.mk!=='t'&&!(o.k&&!S.done[o.k])),done=F.filter(o=>o.mk==='t');
 const line=o=>{const t=`<span class="tag">${o.mod}</span>`;return li({...o,name:o.name}).replace('<span class="cn">','<span class="cn">'+t)};
 const sec=(t,arr,cls,open=true)=>`<div class="sec2 ${cls}"><div class="sh3">${t} <span class="cnt">${arr.length}</span></div>${open?arr.map(line).join(''):''}</div>`;
 $('mid').innerHTML=HEAD()+`<div class="cbody">${sec('To do now',now,'now')}${sec('Coming up',next,'next')}<div class="sec2 dn2"><div class="sh3 more" data-m="__done">Done <span class="cnt">${done.length}</span><span class="chev${S.open.__done?' rot':''}">›</span></div>${S.open.__done?done.map(line).join(''):''}</div></div>`;
 bindCommon();
}
function mid(){ if(S.order!=='o1')return midA(); ({A:midA,B:midB,C:midC})[S.opt](); }
function optsw(){$('optsw').innerHTML=[['A','Row by row'],['B','Steps on top'],['C','By what to do']].map(([k,t])=>`<span class="${S.opt===k?'on':''}" data-o="${k}">${k} · ${t}</span>`).join('');$('optsw').querySelectorAll('span').forEach(e=>e.onclick=()=>{S.opt=e.dataset.o;history.replaceState(null,'','?opt='+S.opt);optsw();mid()})}
function wire(){
 const k=S.sel;if(!k)return;const f=S.f[k];const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn)};
 on('e_d','change',e=>{f.d=e.target.value;mid()});
 on('e_t','change',e=>{f.t=e.target.value});
 on('e_me','change',e=>{f.me=e.target.value;mid()});
 on('e_s','change',e=>{f.s=e.target.value;mid()});
 on('e_ch','change',e=>{f.ch=e.target.value;mid()});
 on('e_rc','input',e=>{f.rc=e.target.value;const b=$('e_save');if(b&&ACTS[k].po&&k.startsWith('s'))b.disabled=!e.target.value.trim()});
 if($('e_t')){$('e_t').value=f.t||'';$('e_t').onchange=e=>{f.t=e.target.value}}
 if($('e_s'))$('e_s').querySelectorAll('span').forEach(e=>e.onclick=()=>{f.s=e.textContent;mid()});
 if($('e_r'))$('e_r').querySelectorAll('input').forEach(e=>e.onchange=()=>{f.r=e.value;mid()});
 if($('e_a'))$('e_a').querySelectorAll('span').forEach(e=>e.onclick=()=>{f.a=e.textContent;mid()});
 if($('e_rs')){$('e_rs').value=f.rs||'';$('e_rs').onchange=e=>{f.rs=e.target.value;mid()}}
 on('e_do','change',e=>{f.do=e.target.checked;mid()});
 on('e_dono','input',e=>{f.dono=e.target.value});
 on('e_ans','change',e=>{f.a=e.target.value;mid()});
 [0,1].forEach(n=>{on('e_bq'+n,'change',e=>{f.b=f.b||[];f.b[n]={...(f.b[n]||{}),q:e.target.value};mid()});on('e_bd'+n,'change',e=>{f.b=f.b||[];f.b[n]={...(f.b[n]||{}),d:e.target.value};mid()})});
 on('e_cr','change',e=>{f.r=e.target.value;mid()});
 on('e_cancel','click',()=>{S.sel=null;render()});
 on('e_save','click',()=>{S.done[k]=1;toast('Saved');S.sel=null;render()});
}
const SUPREM=(A)=>"Hi,\nFriendly reminder, checking the stock ETA for this PO.\n\nPO: "+A.po+"\nItem: 1× "+A.sku+"\nNeeded by: Wed, 30 Sep\n\nPlease advise when the stock will be ready. Thank you!";
const SUPMSG=(A)=>"Hi,\nFollowing up, we still need the stock ETA for this PO.\n\nPO: "+A.po+"\nItem: 1× "+A.sku+"\nNeeded by: Wed, 30 Sep\n\nPlease confirm the ready date so we can plan the delivery. Thank you!";
const COMM={
 get Supplier(){const key=S.sel&&(S.sel.startsWith('po')||S.sel.startsWith('s'))?S.sel:'s1';const A={...ACTS[key],...(key.startsWith('po')?ACTS['s'+key.slice(2)]:{})};
  if(key.startsWith('s'))return {available:false,to:A.sup+' · WhatsApp group',tpl:['Send PO'],msg:['Message not available'],hist:[[A.po+' issued','Thu, 3 Sep']]};
  return {to:A.sup+' · WhatsApp group',tpl:['Chase','Remind'],msg:[SUPMSG(A),SUPREM(A)],hist:[[A.po.replace(' V1','')+' issued','Thu, 3 Sep']]}},
 Warehouse:{available:false,to:'Carres Klang',tpl:['No template yet'],msg:['Warehouse has no governed message yet. Its facts show in the Route.'],hist:[]},
 Logistics:{to:'NETS · WhatsApp group',tpl:['Deadline follow-up','Reminder'],msg:["Hi NETS,\nFollowing up, this delivery is still not booked.\n\nCustomer: 12341234 (Kuala Lumpur)\nItem: 1× CODY-Q\n1× H1401S-K\nScheduled delivery needed by: Mon, 28 Sep\n\nPlease confirm the delivery date with the customer. Thank you!","Hi NETS,\nFriendly reminder, this delivery still needs an arrangement.\n\nCustomer: 12341234 (Kuala Lumpur)\nItem: 1× CODY-Q\n1× H1401S-K\nScheduled delivery needed by: Mon, 28 Sep\n\nPlease confirm the delivery date with the customer. Thank you!"],hist:[['NETS assigned','Tue, 8 Sep']]},
 Customer:{to:'12341234 · WhatsApp',tpl:['Standard follow-up','Standard reminder'],msg:["Hi 12341234,\nFollowing up on your order, the balance below is still outstanding.\n\nOutstanding: RM 2,284.00\nItem: 1× CODY-Q\n1× H1401S-K\n\nKindly arrange payment so we can proceed. Thank you!","Hi 12341234,\nJust a friendly reminder regarding your order.\n\nOutstanding: RM 2,284.00\nItem: 1× CODY-Q\n1× H1401S-K\n\nDo let us know once arranged. Thank you!"],hist:[]},
};
S.tpl={Supplier:0,Warehouse:0,Logistics:0,Customer:0};
function comm(){
 const c=COMM[S.tab],t=S.tpl[S.tab],canCopy=c.available!==false&&!!c.msg[t];
 $('comm').innerHTML=`<div class="phd">Communication</div><div class="bd"><div class="tabs">${['Supplier','Warehouse','Logistics','Customer'].map(x=>`<span class="${x===S.tab?'on':''}">${x}</span>`).join('')}</div>
 <div class="cl" style="margin-top:0">To</div><div class="sel2">${c.to}<span>▾</span></div>
 <div class="cl">Template</div><select class="sel2" id="tpl">${c.tpl.map((x,i)=>`<option value="${i}" ${i===t?'selected':''}>${x}</option>`).join('')}</select>
 <div class="cl">Message</div><div class="msg">${c.msg[t]}</div>
 <div class="icons"><button class="ic" id="wa" aria-label="WhatsApp" title="Not connected in this prototype" disabled>${WA}</button><button class="ic" id="em" aria-label="Email" title="Not connected in this prototype" disabled>${EM}</button><button class="btn" id="copy" ${canCopy?'':'disabled'}>Copy message</button></div>
 <div class="histc" id="hist">History <span class="cnt">${c.hist.length}</span><span class="chev${S.hist?' rot':''}">›</span></div>
 ${S.hist?c.hist.map(h=>`<div class="hi">${h[0]}<span>${h[1]}</span></div>`).join(''):''}</div>`;
 $('comm').querySelectorAll('.tabs span').forEach(e=>e.onclick=()=>{S.tab=e.textContent;S.hist=false;comm()});
 $('tpl').onchange=e=>{S.tpl[S.tab]=+e.target.value;comm()};
 $('hist').onclick=()=>{S.hist=!S.hist;comm()};
 $('copy').onclick=async()=>{if(!canCopy)return;try{await navigator.clipboard.writeText(c.msg[t]);toast('Message copied')}catch{toast('Could not copy message')}};
 
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1600)}
document.addEventListener('click',e=>{const a=e.target.closest('a.dl');if(!a)return;e.stopPropagation();const d=a.dataset.doc;$('shT').textContent=d;$('shS').textContent='';
 $('shB').innerHTML=`<div class="blank">The official ${d} PDF opens here (the prototype cannot render it)</div>`;$('ov').classList.add('on');$('sheet').classList.add('on')},true);
const close=()=>{$('ov').classList.remove('on');$('sheet').classList.remove('on')};$('shX').onclick=close;$('ov').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function fit(){const z=innerWidth<900?innerWidth/900:1;document.documentElement.style.zoom=z;document.querySelector('.page').style.height=(innerHeight/z-44)+'px'}
addEventListener('resize',fit);
function render(){fit();rail();mid();comm()}
S.sel=null;S.tab='Supplier';render();
</script>
</body></html>
