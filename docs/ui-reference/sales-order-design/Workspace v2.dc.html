<dc-import name="Carres Shell" crumb="Workspace" title="{{ title }}" nav="workspace" alerts="{{ 6 }}" team-on="{{ 8 }}" det="{{ false }}" summary="{{ none }}" tabs="{{ tabs }}" chips="{{ none }}" more="{{ more }}" tasks="{{ tk }}" no-tasks="{{ true }}" hint-size="100%,100vh">
  <div style="min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:0 2px 24px;max-width:880px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

    </div>
    <div role="tablist" aria-label="Days" style="display:flex;gap:4px;overflow-x:auto;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:8px;padding:6px;scrollbar-width:thin"><sc-for list="{{ days }}" as="d" hint-placeholder-count="14"><button role="tab" aria-selected="{{ d.on }}" onClick="{{ d.pick }}" title="{{ d.tip }}" style="flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;border-radius:6px;background:{{ d.bg }};cursor:pointer;font:inherit;font-weight:{{ d.bw }}"><span style="font-size:12px;font-weight:500;color:{{ d.wFg }}">{{ d.wd }}</span><span style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:{{ d.fw }};background:{{ d.cBg }};color:{{ d.fg }}">{{ d.n }}</span><span style="display:flex;align-items:center;gap:3px;height:12px"><span style="width:6px;height:6px;border-radius:50%;background:{{ d.dot }}"></span><span style="font-size:12px;color:#6B7280">{{ d.cnt }}</span></span></button></sc-for></div>
    <sc-if value="{{ formOpen }}">

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">

          <sc-if value="{{ nf.isSup }}"><label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#374151">Supplier</span><select value="{{ nf.name }}" onChange="{{ nf.onName }}" style="height:34px;border:1px solid #D5D9DE;border-radius:8px;font:inherit;font-size:13px;background:#FFFFFF;padding:0 8px"><option value="">Choose…</option><sc-for list="{{ supNames }}" as="s" hint-placeholder-count="4"><option value="{{ s }}">{{ s }}</option></sc-for></select></label></sc-if>
          <sc-if value="{{ nf.isText }}"><label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#374151">{{ nf.nameL }}</span><input value="{{ nf.name }}" onInput="{{ nf.onName }}" placeholder="{{ nf.namePh }}" style="height:34px;border:1px solid #D5D9DE;border-radius:8px;font:inherit;font-size:13px;padding:0 10px"></label></sc-if>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">

        <sc-if value="{{ g.moreOn }}"><div role="menu" style="display:flex;gap:4px;flex-wrap:wrap;border:1px solid #E5E7EB;border-radius:8px;padding:4px;background:#FFFFFF;align-self:flex-end"><sc-for list="{{ g.menu }}" as="m" hint-placeholder-count="2"><button role="menuitem" onClick="{{ m.f }}" title="{{ m.tip }}" style="display:flex;align-items:center;gap:6px;height:30px;border:0;border-radius:6px;background:transparent;padding:0 8px;font:inherit;font-size:13px;color:#1F2937;cursor:pointer;opacity:{{ m.op }}" style-hover="background:rgba(31,41,55,.08)"><i class="material-symbols-rounded" aria-hidden="true" style="font-size:16px;font-style:normal;color:#6B7280">{{ m.ic }}</i>{{ m.l }}</button></sc-for></div></sc-if>
        <sc-for list="{{ g.items }}" as="t" hint-placeholder-count="2">
          <div style="border:1px solid {{ t.bd }};border-radius:8px;background:{{ t.bg }};display:flex;flex-direction:column">
            <div style="display:grid;grid-template-columns:72px minmax(0,1fr) 32px;gap:10px;align-items:start;padding:10px 8px 10px 12px">
              <button onClick="{{ t.toggle }}" style="all:unset;cursor:pointer;font-size:13px;font-weight:600;color:{{ t.tmFg }};padding-top:1px">{{ t.tm }}</button>
              <button onClick="{{ t.toggle }}" aria-expanded="{{ t.open }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:13px;font-weight:500;color:{{ t.tFg }};text-decoration:{{ t.strike }};text-wrap:pretty">{{ t.t }}</span><span style="font-size:12px;color:#6B7280;text-wrap:pretty">{{ t.sub }}</span></button>
              <button onClick="{{ t.tick }}" aria-label="{{ t.tickTip }}" title="{{ t.tickTip }}" style="width:32px;height:32px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:rgba(31,41,55,.08)"><i class="material-symbols-rounded" aria-hidden="true" style="font-size:22px;font-style:normal;color:{{ t.tickFg }}">{{ t.tickIc }}</i></button>
            </div>
            <sc-if value="{{ t.open }}"><div style="border-top:1px solid #F0F1F3;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px">
              <sc-for list="{{ t.facts }}" as="f" hint-placeholder-count="2"><div style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:13px"><span style="font-size:12px;color:#6B7280">{{ f.l }}</span><span>{{ f.v }}</span></div></sc-for>
              <sc-if value="{{ t.isSys }}"><div style="display:flex;flex-direction:column;gap:6px">
                <div style="border:1px solid #E5E7EB;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:#1B1B39;color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none">1</span><span style="flex:1;font-size:13px">{{ t.step1 }}</span></div>
                <div style="border:1px solid #E5E7EB;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:#1B1B39;color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none">2</span><span style="flex:1;font-size:13px">{{ t.step2 }}</span><button onClick="{{ t.go }}" style="height:30px;border:0;border-radius:8px;background:#1B1B39;color:#FFFFFF;padding:0 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer" style-hover="background:#2B2B55">{{ t.goL }}</button></div>
              </div></sc-if>
              <sc-if value="{{ t.isMan }}"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input value="{{ t.res }}" onInput="{{ t.onRes }}" placeholder="Result (optional): what happened" aria-label="Result" style="flex:1;min-width:200px;height:32px;border:1px solid #D5D9DE;border-radius:8px;font:inherit;font-size:13px;padding:0 10px"><button onClick="{{ t.markDone }}" style="height:32px;border:0;border-radius:8px;background:#1B1B39;color:#FFFFFF;padding:0 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#2B2B55">Mark done</button></div></sc-if>
            </div></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
    <sc-if value="{{ doneLink }}"><button onClick="{{ goDone }}" style="align-self:flex-start;height:32px;border:0;border-radius:8px;background:transparent;color:#1F2937;padding:0 8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:rgba(31,41,55,.08)"><i class="material-symbols-rounded" aria-hidden="true" style="font-size:18px;font-style:normal;color:#2F55E0">check_circle</i>{{ doneLinkT }}<i class="material-symbols-rounded" aria-hidden="true" style="font-size:16px;font-style:normal">arrow_forward</i></button></sc-if>
    <sc-if value="{{ empty }}"><div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px;font-size:13px;color:#6B7280">{{ emptyT }}</div></sc-if>
  </div>
</dc-import>
<sc-if value="{{ toast }}"><div role="status" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#1F2937;color:#FFFFFF;border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 8px 24px rgba(17,24,39,.2)">{{ toast }}</div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Workspace v2 (owner 11 Oct): tabs on top with counts; tasks grouped by who you contact (Supplier · Logistics · Customer · In-house); + New task, can be given to anyone.
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MOI = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
const LS = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const t12 = hm => { const m = String(hm || '').match(/^(\d{1,2}):(\d\d)/); if (!m) return ''; const h = +m[1]; return ((h % 12) || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'); };
const mins = s => { const m = String(s).match(/(\d{1,2}):(\d\d) ?([AP])M/); return m ? ((+m[1] % 12) + (m[3] === 'P' ? 12 : 0)) * 60 + +m[2] : 9000; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
class Component extends DCLogic {
  state = { tab: (((location.hash || '').match(/tab=([a-z]+)/) || [])[1] || 'todo').replace(/^(all|prog|wait)$/, 'todo'), day: null, open: null, form: false, nf: null, res: {}, tk: 0, toast: '' };
  componentDidMount() { this._t = () => this.setState(s => ({ tk: s.tk + 1 })); ['carres-theme', 'storage'].forEach(e => window.addEventListener(e, this._t)); this._p = setInterval(() => { if (window.SUP) { clearInterval(this._p); this._t(); } }, 200); this._seed(); }
  componentWillUnmount() { ['carres-theme', 'storage'].forEach(e => window.removeEventListener(e, this._t)); clearInterval(this._p); clearTimeout(this._tt); }
  _seed() { const C = window.CarresTasks; if (!C || C.all('tasks').length) return; ['Purchasing v3.dc.html#po', 'Sales Order Outright v12.dc.html'].forEach((src, i) => { const f = document.createElement('iframe'); f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1; f.style.cssText = 'position:fixed;left:-9999px;top:0;width:1440px;height:800px;opacity:0;pointer-events:none'; f.src = src; document.body.appendChild(f); setTimeout(() => { f.remove(); this._t(); }, 5000 + i * 500); }); }
  toast(t) { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 3200); }
  renderVals() {
    const S = this.state, set = o => this.setState(o), C = window.CarresTasks, ME = C ? C.ME : 'Staff A', lab = n => n === ME ? 'You' : C && C.label ? C.label(n) : n;
    const th = window.CarresTheme ? window.CarresTheme.get() : { selFg: '#2F55E0', selBg: '#EEF4FF' };
    const SUP = window.SUP || {}, short = k => (window.SHORT ? window.SHORT(k) : String(k).replace(/ (Furniture )?Sdn Bhd$/, ''));
    const supNames = Object.keys(SUP).map(short), supKey = n => Object.keys(SUP).find(k => short(k) === n || String(SUP[k].aka || '') === n);
    const T0 = new Date(new Date().toDateString()), now = new Date();
    const map = C ? C.owners() : {}, sys = (C ? C.all('tasks') : []).map(r => ({ ...r, own: C.ownerOf(r, map) })).filter(r => r.own === ME);
    const doneSys = (C ? C.all('done') : []).filter(r => r.day === new Date().toDateString() && !/ · (undone|being corrected|corrected)\b| · Undo off/.test(r.t));
    const man = LS.get('carres.manual', []);
    const partyOf = (t, who) => { const s = String(t), w = who && who !== 'SO Batch' ? who : (s.match(/(?: to | from |^Ask (?:again )?)([A-Z][A-Za-z]+(?: [A-Z][A-Za-z]+)?)/) || [])[1];
      if (/Logistics/i.test(s)) return ['Logistics', 'Logistics', 'local_shipping'];
      if (/customer/i.test(s)) return ['Customer', 'Customer', 'person'];
      if (w && supKey(w)) return [w, 'Supplier', 'factory'];
      return ['In-house', 'No outside contact', 'apartment']; };
    const dayFrom = s => { const m = String(s || '').match(/(\d{1,2}) (\w{3})/); return m && MOI[m[2]] != null ? new Date(T0.getFullYear(), MOI[m[2]], +m[1]) : null; };
    const wdD = d => WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()];
    const goSys = r => () => { if (!r.href) return; const ref = String(r.ref || '').split(/[ ,·]/)[0], rec = /^PO-/.test(ref) ? 'po=' + encodeURIComponent(ref) + '&' : /^Sales/.test(r.mod) && ref ? 'so=' + encodeURIComponent(ref) + '&' : ''; location.href = r.href.split('#')[0] + '#' + rec + 'task=' + encodeURIComponent(r.key || '') + '&from=ws:' + S.tab; };
    const items = [];
    sys.forEach(r => { const [pn, pk, pi] = partyOf(r.t, r.who), st = r.prog ? 'prog' : (r.fol || r.later) ? 'wait' : 'todo', d = dayFrom(r.dueDay), tm = r.late ? (d ? d.getDate() + ' ' + MO[d.getMonth()] : (String(r.sub || '').match(/(\d+) days? late/) ? (x => x.getDate() + ' ' + MO[x.getMonth()])(new Date(+T0 - +String(r.sub).match(/(\d+) days? late/)[1] * 864e5)) : 'Late')) : st === 'wait' && d ? d.getDate() + ' ' + MO[d.getMonth()] : (r.due || (String(r.dueDay || '').match(/\d{1,2}:\d\d ?[AP]M/) || [''])[0] || 'Today');
      items.push({ id: 's:' + r.mod + '|' + r.key, kind: 'sys', r, st, day: r.late || !d ? +T0 : +d, pn, pk, pi, t: r.t, sub: [r.prog ? 'Not saved' : '', r.ref, String(r.sub || r.next || '').replace(/,?\s*\d+ days? late,?\s*/gi, ' ').replace(/^\s*·\s*|\s*·\s*$/g, '').trim()].filter(Boolean).join(' · '), tm, late: !!r.late, sortM: r.late ? -1 : mins(tm), facts: [{ l: 'Module', v: r.mod }, ...(r.ref ? [{ l: 'Record', v: r.ref }] : []), ...(d ? [{ l: st === 'wait' ? 'Next contact' : 'Due', v: wdD(d) }] : [])], step1: pk === 'Supplier' ? 'Contact ' + pn + ' with the button on this card' : pk === 'Logistics' ? 'Tell Logistics (button on this card)' : 'Do it on the ' + r.mod + ' page', step2: 'Record the answer in ' + r.mod, goL: 'Open in ' + r.mod, go: goSys(r) }); });
    man.forEach(m => { const mine = m.who === ME, asked = m.by === ME && m.who !== ME; if (!mine && !asked) return; const d = m.date ? new Date(m.date + 'T00:00:00') : T0, late = !m.done && (d < T0 || (+d === +T0 && m.time && now.getHours() * 60 + now.getMinutes() > mins(t12(m.time)))), today = +d === +T0;
