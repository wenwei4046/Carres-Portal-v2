<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0">
  <script src="./carres-theme.js"></script>
  <script src="./carres-tasks.js"></script>
  <style>.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20}body{margin:0;background:#F6F7F9;font-family:Inter,system-ui,sans-serif;color:#1F2937;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}a{color:#1F2937}a:hover{color:#2F55E0}*{box-sizing:border-box}</style>
</helmet>
<dc-import name="Carres Shell" crumb="Settings" title="{{ title }}" nav="settings" alerts="{{ 6 }}" team-on="{{ 8 }}" det="{{ true }}" side="{{ side }}" summary="{{ none }}" tabs="{{ none }}" chips="{{ none }}" more="{{ more }}" tasks="{{ tk }}" no-tasks="{{ true }}" hint-size="100%,100vh">
  <dc-import name="Settings Staff and Duties" embedded="{{ true }}" sec="{{ sec }}" as="{{ as }}" hint-size="100%,100%" style="display:block;min-height:0;height:100%"></dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SECS = [['co', 'Company', 'apartment'], ['off', 'Office', 'meeting_room'], ['team', 'Team', 'group'], ['tasks', 'Workspace / Tasks', 'task_alt'], ['show', 'Showroom', 'storefront'], ['so', 'Sales Orders', 'receipt_long'], ['pur', 'Purchasing', 'shopping_cart'], ['wh', 'Warehouse', 'warehouse'], ['pay', 'Payments', 'payments'], ['del', 'Delivery', 'local_shipping'], ['care', 'Customer Care', 'support_agent'], ['iss', 'Issue Tracker', 'assignment_late'], ['rep', 'Reports', 'bar_chart'], ['look', 'Appearance', 'palette']];
const secOf = () => { const m = (location.hash || '').match(/sec=([a-z]+)/); return m && SECS.some(x => x[0] === m[1]) ? m[1] : 'co'; };
class Component extends DCLogic {
  state = { sec: secOf(), as: 'jess' };
  componentDidMount() { this._h = () => this.setState({ sec: secOf() }); window.addEventListener('hashchange', this._h); }
  componentWillUnmount() { window.removeEventListener('hashchange', this._h); }
  renderVals() {
    const S = this.state, cur = SECS.find(x => x[0] === S.sec) || SECS[0];
    return {
      none: [], tk: { head: '', rows: [] }, sec: S.sec, as: S.as, title: cur[1],
      side: { title: 'Settings', footT: 'TEST · VIEW AS', foot: [['jess', 'Jess (COO)'], ['a', 'TEST · Staff A']].map(([k, l]) => ({ l, on: S.as === k, pick: () => this.setState({ as: k }) })), items: SECS.map(([k, l, ic]) => ({ l, ic, on: k === S.sec, pick: () => { location.hash = 'sec=' + k; } })) },
      more: [{ h: 'TEST · VIEW AS', items: [['jess', 'Jess (COO)'], ['a', 'TEST · Staff A']].map(([k, l]) => ({ l: l + (S.as === k ? ' · now' : ''), ic: S.as === k ? 'check' : 'person', fn: () => this.setState({ as: k }) })) }]
    };
  }
}
</script>
</body>
</html>
