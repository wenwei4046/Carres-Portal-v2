<script type="text/x-dc" data-dc-script>
// Subscription rows = TEST (uploads/ has no KPI or Diglant stock; FSTOCK in purchasing-data.js). Outright rows = owner-confirmed SO Batch data (SOS0): pieces sold last full month.
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T0 = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const monAdd = n => new Date(T0.getFullYear(), T0.getMonth() + n, 1);
const ML = d => MO[d.getMonth()] + ' ' + d.getFullYear();
// Subscription: KPI month = first month whose 45-day deadline is still ahead (Rental MASTER). Outright: next month, from last full month's sales (owner 13 Oct, all Outright products).
const SUB_M = (() => { for (let k = 1; k < 6; k++) { const m = monAdd(k), d = new Date(+m - 45 * 864e5); if (d >= T0) return m; } return monAdd(2); })();
const OUT_M = monAdd(1), PAST_M = monAdd(-1);
const subDl = () => new Date(+SUB_M - 45 * 864e5);
const outDl = (cat, sup) => window.subWd && window.CD ? window.subWd(OUT_M, (sup && window.CD(cat, sup)) || 0) : OUT_M;
const SH = s => window.SHORT ? window.SHORT(s) : s;
// What is kept as stock (owner 13 Oct): no sofa (and no Hookka sofa pillow); bedframe = only 1013 Jager in one colour, PC151-01, so far. Everything else is bought per sales order in SO Batch.
const KEEP_BF = [{ code: '1013', col: 'PC151-01' }];
const keepOut = (cat, model) => { if (cat === 'Sofa' || cat === 'Pillow' || cat === 'Mattress protector') return false; if (/HOOKKA/i.test(model)) return false; if (cat === 'Bedframe') { const p = model.split('/'), code = (p[0].match(/^\d{4}/) || [])[0], col = (p[2] || '').toUpperCase(); return p.length === 3 && KEEP_BF.some(k => k.code === code && k.col === col); } return true; };
// Supplier (owner 13 Oct): every bedframe = Ohana; sofa code TH = Todern, AM = Armani, DSL = Dorsettloft, HK / Hookka = Ohana. Mattress = Nice Future (6 Oct Inventory: all 213 mattress rows). Else the SO Batch match; else not set.
const supOf = (cat, model, sup) => { const u = String(model || '').toUpperCase();
  if (cat === 'Bedframe') return 'Ohana Furniture Sdn Bhd';
  if (/(^|[^A-Z])HK\s?\d|HOOKKA/.test(u)) return 'Ohana Furniture Sdn Bhd';
  if (cat === 'Sofa') { if (/(^|[^A-Z])TH\s?\d/.test(u)) return 'Todern'; if (/(^|[^A-Z])AM\s?\d/.test(u)) return 'Armani'; if (/DSL\s?\d/.test(u)) return 'Dorsettloft Sofa'; }
  if (cat === 'Mattress') return 'Nice Future Sdn Bhd';
  if (cat === 'Pillow' || cat === 'Mattress protector') return CHINA;
  return sup || ''; };
// Pillow + mattress protector: John Curtis (China), ordered 2 months ahead (owner 13 Oct). Sales month = first month whose 1st − 2 months is still ahead.
const CHINA = 'John Curtis';
const chinaMon = () => { for (let k = 1; k < 8; k++) { const m = monAdd(k), d = new Date(m.getFullYear(), m.getMonth() - 2, m.getDate()); if (d >= T0) return m; } return monAdd(3); };
const chinaDl = m => new Date(m.getFullYear(), m.getMonth() - 2, 1);
const ROWS0 = () => {
  const sub = (window.FSTOCK || []).filter(f => f.biz === 'Subscription').map(f => ({ id: 'sub|' + f.model + '|' + f.spec, biz: 'sub', test: true, cat: 'Mattress', model: f.model, spec: f.spec, sup: 'Diglant', base: ({ Queen: 60, King: 30, Single: 10 })[f.spec] ?? null, safety: 0, held: f.held, pos: f.pos, mon: SUB_M, dl: subDl() }));
  const ymOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const T0S = ymOf(T0) + '-' + String(T0.getDate()).padStart(2, '0'), D30 = (() => { const d = new Date(+T0 - 30 * 864e5); return ymOf(d) + '-' + String(d.getDate()).padStart(2, '0'); })();
  const D14 = (() => { const d = new Date(+T0 - 14 * 864e5); return ymOf(d) + '-' + String(d.getDate()).padStart(2, '0'); })();
  const g = {}, M3 = [ymOf(monAdd(-2)), ymOf(PAST_M), ymOf(monAdd(0))], pm = M3[1];
  (window.OPS_SALES || []).filter(o => M3.includes(o[0].slice(0, 7))).forEach(o => { const [, ref, cat, model0, spec0, q, sup0] = o, model = cat === 'Bedframe' ? model0.replace(/\/\s*COL(OUR)?\s*:?\s*/i, '/').replace(/\s*\/\s*/g, '/').replace(/\/or /i, '/').replace(/PC ?(\d{3})/i, 'PC$1').trim() : model0, sup = supOf(cat, model, sup0), spec = cat === 'Sofa' || cat === 'Pillow' ? '' : spec0; if (!keepOut(cat, model)) return; const k = cat + '|' + model + '|' + spec, mi = M3.indexOf(o[0].slice(0, 7)); (g[k] = g[k] || { cat, model, spec, sup, q: 0, m3: [0, 0, 0], d30: 0, sos: [] }); g[k].m3[mi] += q; if (o[0] > D30 && o[0] <= T0S) g[k].d30 += q; if (o[0] > D14 && o[0] <= T0S) g[k].d14 = (g[k].d14 || 0) + q; if (mi === 1) { g[k].q += q; if (!g[k].sos.includes(ref)) g[k].sos.push(ref); } if (sup && !g[k].sup) g[k].sup = sup; });
  // Mattress: list all 4 sizes of every model sold (owner 13 Oct), 0 when not sold.
  Object.values(g).filter(x => x.cat === 'Mattress').map(x => x.model).filter((m, i, a) => a.indexOf(m) === i).forEach(m => { const ref = Object.values(g).find(x => x.cat === 'Mattress' && x.model === m); ['King', 'Queen', 'Super Single', 'Single'].forEach(s => { const k = 'Mattress|' + m + '|' + s; if (!g[k]) g[k] = { cat: 'Mattress', model: m, spec: s, sup: ref.sup, q: 0, m3: [0, 0, 0], d30: 0, sos: [] }; }); });
  const fo = (window.FSTOCK || []).filter(f => f.biz === 'Outright');
  const inv = {}; (window.INV_FREE || []).forEach(f => { const k = window.invKey ? window.invKey(f[1], f[2]) : f[0]; if (k) (inv[k] = inv[k] || []).push(f); });
  const out = Object.values(g).map(x => { const ik = window.invKey ? window.invKey(x.cat, x.model, x.spec) : '', st = ik ? (inv[ik] || []) : [], f = { held: st.reduce((a, s) => a + s[3], 0), pos: [], stock: st, matched: !!ik }; const mg = x.cat === 'Bedframe' ? x.model.split('/').slice(0, 2).join(' ').replace(/^(\d{4})(\D)/, '$1 $2') + ' · ' + x.model.split('/').slice(2).join(' · ') : x.model, vr = '';
    return { id: 'out|' + x.cat + '|' + x.model + '|' + x.spec, biz: 'out', test: false, stock: f.stock, matched: f.matched, mg, vr, cat: x.cat, model: x.model, spec: x.spec || 'One size', sup: x.sup || '', base: x.q, m3: x.m3, d30: x.d30, d14: x.d14 || 0, sos: x.sos, safety: 0, held: f.held, pos: f.pos, mon: x.sup === CHINA ? chinaMon() : OUT_M, dl: x.sup === CHINA ? chinaDl(chinaMon()) : outDl(x.cat, x.sup), weekly: false, lead: x.sup === CHINA ? '2 months' : ((window.CD && window.CD(x.cat, x.sup)) || 0) ? (window.CD(x.cat, x.sup)) + ' working days' : 'Not recorded' }; });
  const sv = (() => { try { return JSON.parse(localStorage.getItem('carres.fc.kpi') || '{}'); } catch (e) { return {}; } })();
  return [...sub, ...out].map(r => { const k = sv[r.id + '|' + ML(r.mon)]; return k != null ? { ...r, base0: r.base, base: k, saved: true } : r; });
};
const WHY = ['Promotion this month', 'New showroom or dealer', 'Expect more orders than forecast', 'Expect fewer orders than forecast', 'Supplier minimum batch', 'Other'];
const resvOf = r => (window.SOS0 || []).filter(s => s.type === (r.biz === 'out' ? 'Outright' : 'Subscription')).flatMap(s => s.items.filter(i => i.forecast && i.model === r.model && i.spec === r.spec).map(i => [s.so, i.qty, i.fcSrc === 'po' ? i.fcPo : 'held']));
const pcs = n => n + (n === 1 ? ' pc' : ' pcs');
// Copy Standard: date = weekday + day + month, e.g. "Fri, 16 Oct" (one format everywhere; year only on printed documents).
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const f1 = d => WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()];
const WK = (() => { const d = new Date(T0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
// One review day a week (owner 13 Oct "forecast should make one day review, not everyday"; follows SAP weekly MRP run / periodic review): Monday. Order the same day.
const FRI = new Date(WK + 'T00:00:00');
const tIdx = n => 'TEST-FP-2610-' + String(n).padStart(3, '0');
const leftOf = d => Math.round((d - T0) / 864e5);
const dlTxt = n => n > 0 ? 'Order in ' + n + (n === 1 ? ' day' : ' days') : n === 0 ? 'Order today' : (-n) + (n === -1 ? ' day late' : ' days late');

class Component extends DCLogic {
  state = { oView: 'model', /* "Set stock level" view removed (owner 13 Oct "what?"): the 2-week level is worked out by the system; code kept */ keep: (() => { try { return JSON.parse(localStorage.getItem('carres.fc.keep') || '{}'); } catch (e) { return {}; } })(), kEd: null, repM: null, skip: (() => { try { return JSON.parse(localStorage.getItem('carres.fc.skip') || '{}'); } catch (e) { return {}; } })(), grp: 'grid', cN: 12, cId: null, cM: null, cS: null, play: false, pk: {}, biz: 'out', /* Subscription not started yet (owner 13 Oct): Outright only; Subscription code kept for later. */ view: 'all', rows: ROWS0(), sel: {}, ed: null, rv: false, toast: '', ordered: {}, nextPo: 2, tasks: [], got: {}, via: {}, sent: {}, tkOpen: null };
  componentDidMount() { const go = () => { if (window.FSTOCK && window.SOS0 && window.OPS_SALES && window.INV_FREE) { if (!this.state.rows.length) this.setState({ rows: ROWS0() }); } else this._w = setTimeout(go, 50); }; go(); }
  componentWillUnmount() { clearTimeout(this._w); clearTimeout(this._t); }
  // Weekly POs (owner 13 Oct, follows SAP / Odoo weekly lot size): Outright items from suppliers with ≤ 14 production days are bought one week of the sales month at a time.
  weeksOf(r, have) {
    const y = r.mon.getFullYear(), mo = r.mon.getMonth(), dim = new Date(y, mo + 1, 0).getDate(), rg = [[1, 7], [8, 14], [15, 21], [22, dim]], need = (r.base || 0);
    const raw = rg.map(([a, b]) => need * (b - a + 1) / dim), fl = raw.map(Math.floor); let left = need - fl.reduce((s, v) => s + v, 0);
    raw.map((v, i) => [v - fl[i], i]).sort((p, q) => q[0] - p[0]).forEach(([, i]) => { if (left > 0) { fl[i]++; left--; } });
    let cum = 0, cumBuy = 0; const days = (window.CD && window.CD(r.cat, r.sup)) || 0;
    return rg.map(([a, b], i) => { const nd = fl[i] + (i === 0 ? r.safety : 0); cum += nd; const buy = Math.max(0, cum - have - cumBuy); cumBuy += buy; const st = new Date(y, mo, a);
      return { i, from: st, to: new Date(y, mo, b), lbl: a + '–' + b + ' ' + MO[mo], need: nd, buy, dl: window.subWd ? window.subWd(st, days) : st }; });
  }
  // Outright = Keep in stock (owner 13 Oct, follows Odoo min/max reordering rule): To buy = Keep − Have when Have is below Keep.
  // Suggested Keep (owner 13 Oct "Sep 49 but Oct only 17, too risky"): from the last 30 days, so a drop in sales lowers it at once. Nice Future / Ohana = 14 days of sales; John Curtis = 75 days (takes 2 months).
  // Daily rate (owner 13 Oct "Oct 2 weeks I only sold 17"): Nice Future / Ohana use the last 14 days, so a drop shows at once; John Curtis (2 months ahead) uses the last 30 days.
  rate(r) { return r.sup === CHINA ? (r.d30 || 0) / 30 : (r.d14 || 0) / 14; }
  sugKeep(r) { return Math.ceil(this.rate(r) * (r.sup === CHINA ? 75 : 14)); }
  // Weekly cap (owner 13 Oct "1 week buy 18? so many"; follows Odoo max per order): Nice Future / Ohana buy at most 7 days of sales a week, the rest follows next week. John Curtis (monthly, 2 months) is not capped.
  capOf(r) { if (r.sup === CHINA) return Infinity; return Math.max(1, Math.ceil(this.rate(r) * 7)); }
  keepOf(r) { const S = this.state || {}, k = (S.keep || {})[r.id]; return k != null ? k : this.sugKeep(r); }
  calc(r) {
