<!-- @dsCard group="Colors" viewport="700x180" name="Text layering" subtitle="Content is DARK. Labels/meta are muted. NEVER pale content text." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface);font-family:var(--font-sans);display:flex;flex-direction:column;gap:12px}
.line{display:flex;align-items:baseline;gap:14px}
.k{width:150px;font-size:11px;font-family:var(--font-mono);color:var(--text-muted)}
.bad{margin-top:4px;font-size:12px;color:var(--overdue-ink);background:var(--overdue-fill);padding:6px 10px;border-radius:6px;align-self:flex-start}</style></head>
<body>
<div class="line"><span class="k">#1A1A1A primary</span><span style="font-size:15px;font-weight:500;color:#1A1A1A">REF · customer · date · amount · address</span></div>
<div class="line"><span class="k">#6B7280 secondary</span><span style="font-size:14px;color:#6B7280">supporting detail, sub-lines</span></div>
<div class="line"><span class="k">#A8A8A8 muted</span><span style="font-size:12px;color:#A8A8A8;text-transform:uppercase;letter-spacing:.04em">PHONE · ordered · table header</span></div>
<div class="bad">✕ Do NOT put content (dates, names, amounts) in muted grey — that is the "everything is pale, can't read" bug v4 fixed.</div>
</body></html>
