<!-- @dsCard group="Components" viewport="700x170" name="List row (data)" subtitle="Fixed 44px order row — content adapts, the row never grows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px 20px;background:var(--canvas);font-family:var(--font-sans)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
th{height:30px;background:#221F20;color:#C9C5BB;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:0 12px}
td{height:44px;padding:0 12px;border-top:1px solid rgba(17,24,39,.06);font-size:12px;color:#1F2937;vertical-align:middle}
.ref{font-size:13px;font-weight:600;color:#111827}.sub{font-size:10px;color:#9CA3AF}
.date{font-size:12.5px;font-weight:600}.wk{font-size:10px;color:#9CA3AF}</style></head>
<body>
<table>
<tr><th style="width:34px"></th><th>Ref</th><th>Customer</th><th>Region</th><th>Deadline</th><th>Stock</th><th>Next</th></tr>
<tr><td><input type="checkbox" class="checkbox is-select" checked></td>
<td><div class="ref">TCF0475 <span class="sub">+2</span></div><div class="sub mono">SO-1112</div></td>
<td>Wong Young Huu</td><td style="color:#4B5563">Kuala…</td>
<td><span class="date" style="color:#DC2626">13 Jul 26</span> <span class="wk">over</span></td>
<td><span class="pill pill-waiting"><span class="dot"></span>Waiting 0/3</span></td>
<td><span class="pill pill-overdue">Chase logistic</span></td></tr>
</table>
</body></html>
